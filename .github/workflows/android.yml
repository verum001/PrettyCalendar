name: Android build and checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
      - name: Enforce APK size target and licensing
        run: python3 tests/check-apk.py app/build/outputs/apk/debug/app-debug.apk
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: pretty-calendar-debug
          path: app/build/outputs/apk/debug/app-debug.apk
