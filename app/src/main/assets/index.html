<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fff8f2" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file:; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'"
    />
    <title>pretty calendar</title>
    <link rel="stylesheet" href="style.css" />
    <script src="calendar.js" defer></script>
  </head>
  <body>
    <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <symbol id="lotus" viewBox="0 0 32 32">
          <g fill="currentColor" stroke="currentColor" stroke-linejoin="round" stroke-width=".8">
            <path d="M16 27C6 27 2 20 1 12c9 1 15 7 15 15Zm0 0c10 0 14-7 15-15-9 1-15 7-15 15Z" opacity=".8" />
            <path d="M16 26C7 22 5 14 7 6c7 4 11 11 9 20Zm0 0c9-4 11-12 9-20-7 4-11 11-9 20Z" />
            <path d="M16 3c-7 8-8 15 0 23 8-8 7-15 0-23Z" />
          </g>
          <path d="M16 8v13M8 12c1 5 3 8 6 11m10-11c-1 5-3 8-6 11" fill="none" stroke="#fff8f2" stroke-width="1.1" stroke-linecap="round" opacity=".7" />
          <path d="M9 29h14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </symbol>
        <symbol id="flower" viewBox="0 0 32 32">
          <path
            fill="currentColor"
            d="M16 5C8-4 1 6 7 12-5 13 0 26 10 23c-1 12 13 12 14 2 11 3 15-11 5-15C33 0 20-5 16 5Z"
            transform="translate(1 3) scale(.88)"
          />
          <circle cx="16" cy="16" r="4.1" fill="#fff5c8" />
          <circle cx="15" cy="15" r="1.3" fill="#fffef5" />
        </symbol>
        <symbol id="heart" viewBox="0 0 32 32">
          <path
            fill="currentColor"
            d="M16 28C12 24 2 18 2 10 2 0 13 0 16 7 20 0 30 1 30 10c0 8-10 14-14 18Z"
          />
          <path
            d="M7 10c0-2 2-4 4-3"
            fill="none"
            stroke="#fff"
            stroke-linecap="round"
            stroke-width="2.2"
            opacity=".7"
          />
        </symbol>
        <symbol id="sakura" viewBox="0 0 100 100">
          <g fill="currentColor" stroke="#dc789a" stroke-width="1.4">
            <path
              id="petal"
              d="M50 52C33 40 27 17 42 12L50 19 58 12C73 17 67 40 50 52Z"
            />
            <use href="#petal" transform="rotate(72 50 52)" />
            <use href="#petal" transform="rotate(144 50 52)" />
            <use href="#petal" transform="rotate(216 50 52)" />
            <use href="#petal" transform="rotate(288 50 52)" />
          </g>
          <g stroke="#e8b65d" stroke-width="1.6" stroke-linecap="round">
            <path d="M50 43V30M47 44 40 34M53 44 60 34" />
            <circle cx="50" cy="29" r="2" fill="#edc96d" />
            <circle cx="39" cy="33" r="2" fill="#edc96d" />
            <circle cx="61" cy="33" r="2" fill="#edc96d" />
          </g>
          <g
            fill="none"
            stroke="#71405b"
            stroke-width="2.7"
            stroke-linecap="round"
          >
            <path d="M34 53q4-6 8 0m16 0q4-6 8 0M44 61q6 7 12 0" />
          </g>
          <g fill="#f39ab4" opacity=".7">
            <ellipse cx="33" cy="59" rx="5" ry="3" />
            <ellipse cx="67" cy="59" rx="5" ry="3" />
          </g>
        </symbol>
        <symbol id="branch" viewBox="0 0 220 180">
          <g fill="none" stroke="#ba8b96" stroke-linecap="round">
            <path d="m225 6-85 67-66 31-58 53" stroke-width="4" />
            <path
              d="m157 60-7-39m-35 68-42-8m-3 25-8 31m123-96 12 34"
              stroke-width="2.5"
            />
          </g>
          <g color="#f5bfd2">
            <use href="#sakura" x="105" y="0" width="70" height="70" />
            <use href="#sakura" x="153" y="45" width="60" height="60" />
            <use href="#sakura" x="54" y="57" width="64" height="64" />
            <use href="#sakura" x="29" y="111" width="58" height="58" />
          </g>
          <g fill="#f2b4cb">
            <ellipse
              cx="28"
              cy="91"
              rx="5"
              ry="9"
              transform="rotate(-35 28 91)"
            />
            <ellipse
              cx="126"
              cy="140"
              rx="5"
              ry="9"
              transform="rotate(35 126 140)"
            />
          </g>
        </symbol>
      </defs>
    </svg>
    <div class="backdrop" aria-hidden="true">
      <span class="sparkle s1">✦</span><span class="sparkle s2">✧</span
      ><span class="sparkle s3">✦</span><i class="petal p1"></i
      ><i class="petal p2"></i><i class="petal p3"></i>
    </div>
    <header class="masthead">
      <div class="brand">
        <svg class="mascot" aria-hidden="true"><use href="#sakura" /></svg>
        <div>
          <h1>pretty<br />calendar<span class="title-dot">.</span></h1>
          <p id="greeting">a little space for you</p>
        </div>
      </div>
      <svg class="branch" aria-hidden="true"><use href="#branch" /></svg>
    </header>
    <main
      id="scroller"
      aria-label="Calendar. Scroll up or down through the months."
    >
      <div id="months"></div>
      <p class="privacy">only on your phone · a little care for you</p>
    </main>
    <footer class="guide">
      <div class="legend">
        <span
          ><svg class="purple"><use href="#lotus" /></svg>day 1</span
        ><span
          ><svg class="pink"><use href="#heart" /></svg>day 14</span
        ><span
          ><svg class="rose"><use href="#flower" /></svg>day 28</span
        >
      </div>
      <p>Hold a date to start a new cycle<span>Hold the lotus to clear it</span></p>
      <small class="credit">by Jack Littlejack</small>
    </footer>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
